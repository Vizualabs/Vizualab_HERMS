name: Deploy HERMS API

# Production Lambda deploy. Manual until AWS and Neon secrets exist.
# Do not enable push-to-main auto-deploy until those values are verified.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-api
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: herms
    steps:
      - name: Allow production deploys from main only
        working-directory: .
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production API deploy is only allowed from main. Selected branch: ${GITHUB_REF_NAME}."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run db:check
      - run: bun run build:api

  migrate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: phase-0-migrations
    defaults:
      run:
        working-directory: herms
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-api
    defaults:
      run:
        working-directory: herms
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK_NAME: ${{ vars.AWS_STACK_NAME }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Require AWS configuration
        working-directory: .
        run: |
          missing=0
          if [ -z "$AWS_REGION" ]; then
            echo "::error::AWS_REGION is not set on the production-api GitHub environment."
            missing=1
          fi
          if [ -z "$STACK_NAME" ]; then
            echo "::error::AWS_STACK_NAME is not set on the production-api GitHub environment."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::AWS is not configured yet. Keep using local verification until region, stack name, and OIDC role exist."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:api
      - run: sam validate --template-file infra/aws/template.yaml
      - run: sam build --template-file infra/aws/template.yaml
      - name: Deploy Lambda
        run: >
          sam deploy
          --stack-name "$STACK_NAME"
          --region "$AWS_REGION"
          --capabilities CAPABILITY_IAM
          --resolve-s3
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides "DatabaseUrl=$DATABASE_URL"
      - name: Record stack outputs
        run: sam list stack-outputs --stack-name "$STACK_NAME" --region "$AWS_REGION" --output table
