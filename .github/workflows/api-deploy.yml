name: Deploy HERMS API

# Production Lambda deploy. Manual until AWS and Neon secrets exist.
# Do not enable push-to-main auto-deploy until those values are verified.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-api
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: herms
    steps:
      - name: Allow production deploys from main only
        working-directory: .
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production API deploy is only allowed from main. Selected branch: ${GITHUB_REF_NAME}."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run db:check
      - run: bun run build:api

  migrate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: phase-0-migrations
    defaults:
      run:
        working-directory: herms
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-api
    defaults:
      run:
        working-directory: herms
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_FUNCTION_NAME: ${{ vars.API_FUNCTION_NAME }}
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
    steps:
      - name: Require AWS configuration
        working-directory: .
        run: |
          missing=0
          if [ -z "$AWS_REGION" ]; then
            echo "::error::AWS_REGION is not set on the production-api GitHub environment."
            missing=1
          fi
          if [ -z "$API_FUNCTION_NAME" ]; then
            echo "::error::API_FUNCTION_NAME is not set on the production-api GitHub environment."
            missing=1
          fi
          if [ -z "$API_HEALTH_URL" ]; then
            echo "::error::API_HEALTH_URL is not set on the production-api GitHub environment."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::AWS is not configured yet. Keep using local verification until the existing Lambda and OIDC role are configured."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:api
      - name: Package Lambda bundle
        run: zip -9 -j herms-api.zip apps/api/dist/lambda.mjs
      - name: Update existing Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "$API_FUNCTION_NAME" \
            --zip-file fileb://herms-api.zip \
            --region "$AWS_REGION"
          aws lambda wait function-updated-v2 \
            --function-name "$API_FUNCTION_NAME" \
            --region "$AWS_REGION"
      - name: Verify production health
        run: >
          curl --fail --silent --show-error
          --retry 5
          --retry-all-errors
          --retry-delay 5
          "$API_HEALTH_URL"
