name: HERMS quality

on:
  pull_request:
    paths:
      - 'herms/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'herms/**'
      - '.github/workflows/quality.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: herms
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run db:check
      - run: bun run build
