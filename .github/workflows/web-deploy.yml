name: Deploy HERMS web

# Production Hostinger deploy. Manual until the domain and VPS secrets exist.
# Do not enable push-to-main auto-deploy until those values are verified.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-vps
    defaults:
      run:
        working-directory: herms
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_WEB_ROOT: ${{ vars.VPS_WEB_ROOT }}
    steps:
      - name: Allow production deploys from main only
        working-directory: .
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production web deploy is only allowed from main. Selected branch: ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Require Hostinger VPS configuration
        working-directory: .
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_WEB_ROOT; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set on the production-vps GitHub environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Hostinger/domain setup is not ready. Keep using local verification until VPS values exist."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:web
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      - name: Trust configured VPS host key
        working-directory: .
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload immutable release
        run: |
          release="$VPS_WEB_ROOT/releases/$GITHUB_SHA"
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$release'"
          rsync -az --delete apps/web/dist/client/ "$VPS_USER@$VPS_HOST:$release/"
      - name: Activate release
        run: |
          release="$VPS_WEB_ROOT/releases/$GITHUB_SHA"
          ssh "$VPS_USER@$VPS_HOST" "ln -sfn '$release' '$VPS_WEB_ROOT/current'"
