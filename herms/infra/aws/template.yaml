AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: HERMS Phase 0 Hono API on an AWS Lambda Function URL

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Neon pooled runtime URL supplied by the deployment environment
  ApiTimeoutSeconds:
    Type: Number
    Default: 20
    MinValue: 3
    MaxValue: 25
  PriceEscalationEffectiveDate:
    Type: String
    Description: ISO-8601 timestamp for the first six-month escalation occurrence
  PriceEscalationMode:
    Type: String
    Default: automatic
    AllowedValues:
      - automatic
      - approval_required
    Description: D-03 feature flag; approval_required calculates due dates without changing prices

Resources:
  HermsApi:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: herms-api
      CodeUri: ../../apps/api/dist/
      Handler: lambda.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: !Ref ApiTimeoutSeconds
      Tracing: Active
      Environment:
        Variables:
          APP_ENV: production
          DATABASE_URL: !Ref DatabaseUrl
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  HermsPriceEscalation:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: herms-price-escalation
      CodeUri: ../../apps/api/dist/
      Handler: scheduler.handler
      Runtime: nodejs22.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: !Ref ApiTimeoutSeconds
      Tracing: Active
      Environment:
        Variables:
          APP_ENV: production
          DATABASE_URL: !Ref DatabaseUrl
          PRICE_ESCALATION_EFFECTIVE_DATE: !Ref PriceEscalationEffectiveDate
          PRICE_ESCALATION_MODE: !Ref PriceEscalationMode
      Events:
        DailyEscalation:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(15 0 * * ? *)
            ScheduleExpressionTimezone: Asia/Colombo
            State: ENABLED

Outputs:
  ApiFunctionName:
    Value: !Ref HermsApi
  ApiFunctionUrl:
    Value: !GetAtt HermsApiUrl.FunctionUrl
  ApiTimeoutSeconds:
    Value: !Ref ApiTimeoutSeconds
  PriceEscalationFunctionName:
    Value: !Ref HermsPriceEscalation
